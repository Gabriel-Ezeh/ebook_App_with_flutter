plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.ebook_app_with_flutter"
    compileSdk = 35 // Update to 35 to match the required version

    ndkVersion = "21.1.6352462" // Ensure this matches your Flutter project’s NDK version or Android Studio setup

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    defaultConfig {
        applicationId = "com.example.ebook_app_with_flutter"
        minSdk = 21 // Set this to match the minimum SDK version required for your app
        targetSdk = 35 // Update to 35 for compatibility with dependencies
        versionCode = 1 // Set according to your app's versioning scheme
        versionName = "1.0" // Set according to your app's versioning scheme
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0' // Use the latest version available
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'io.flutter:flutter_embedding_debug:1.0.0'
}

// Apply Google services plugin at the end
apply plugin: 'com.google.gms.google-services'
